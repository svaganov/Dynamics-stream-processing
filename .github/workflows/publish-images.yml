# Публикация образов панели и воркера в GHCR (ghcr.io/svaganov/...).
# Запуск вручную: Actions → Publish images to GHCR → Run workflow,
# версии задаются входными параметрами. Логин — через GITHUB_TOKEN,
# отдельный PAT для CI не нужен.
name: Publish images to GHCR

on:
  workflow_dispatch:
    inputs:
      panel_tag:
        description: "Тег образа панели (audio-panel:<tag>)"
        required: true
        default: "2.1"
      worker_tag:
        description: "Тег образа воркера (audio-worker:<tag>)"
        required: true
        default: "2.4.2"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push audio-panel
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/audio-panel:${{ inputs.panel_tag }}
            ghcr.io/${{ github.repository_owner }}/audio-panel:latest
          cache-from: type=gha,scope=panel
          cache-to: type=gha,mode=max,scope=panel

      - name: Build & push audio-worker
        uses: docker/build-push-action@v6
        with:
          context: worker
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/audio-worker:${{ inputs.worker_tag }}
            ghcr.io/${{ github.repository_owner }}/audio-worker:latest
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
