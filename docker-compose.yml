# Полная контейнеризация: 1 контейнер панели (control plane) + N контейнеров-
# воркеров Liquidsoap, которые панель создаёт и уничтожает динамически через
# Docker API. Воркеры — в общей сети audiopanel_net, читают свои .liq с общего
# тома panel-data (read-only), telnet живой подстройки — по имени контейнера,
# порты на хост не публикуются. Наружу смотрит только порт панели 8770.
#
# Чистая машина = только Docker. Запуск:
#   docker compose up -d --build
# Панель:  http://127.0.0.1:8770
#
# Образ воркера (audio-worker:2.4.2) собирать вручную НЕ нужно: entrypoint
# панели проверяет его наличие и собирает через docker.sock из зашитого
# контекста (отключается WORKER_AUTO_BUILD=0).
#
# ВНИМАНИЕ: монтирование docker.sock даёт панели root-права на хосте —
# это осознанная цена оркестрации без DinD. На SELinux-хостах (RHEL/Fedora)
# добавьте :z к маунту sock.

services:
  # Control plane: реестр станций, жизненный цикл воркеров, UI, подслушка A/B.
  panel:
    build:
      context: .            # корень репозитория: нужен worker/ для автосборки
      dockerfile: app/Dockerfile
    image: audio-panel:2.1
    ports:
      - "8770:8770"
    volumes:
      # Доступ к демону Docker: панель оркестрирует воркеров через API.
      - /var/run/docker.sock:/var/run/docker.sock
      # Реестр станций + runtime .liq воркеров: общий named volume, воркеры
      # монтируют его же read-only — хостовые пути больше не нужны вовсе.
      - panel-data:/data
    networks:
      - audiopanel_net
    # Источники/Icecast на этой же машине: loopback-адреса из конфига
    # переписываются на host.docker.internal (и воркерам, и подслушке).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HOST: 0.0.0.0
      PORT: 8770
      STREAMS_PATH: /data/streams.json
      WORKER_RUNTIME_DIR: /data/runtime
      WORKER_IMAGE: audio-worker:2.4.2
      WORKER_NETWORK: audiopanel_net
      WORKER_VOLUME: panel-data
      # WORKER_AUTO_BUILD: "0"   # отключить автосборку образа воркера
      # Для удалённого демона задайте снаружи:
      # DOCKER_HOST: tcp://remote-host:2376
    restart: unless-stopped

networks:
  audiopanel_net:
    name: audiopanel_net

volumes:
  panel-data:
    name: panel-data
